name: Build Kernel with SukiSU Ultra

on:
  workflow_dispatch:
    inputs:
      kernel_version:
        description: 'Versão do Kernel'
        required: true
        default: '6.1'
        type: choice
        options:
          - '6.1'
          - '6.6'
      device_codename:
        description: 'Codinome do dispositivo'
        required: true
        default: 'garnet'
        type: choice
        options:
          - 'garnet'
          - 'stone'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Build Environment
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            bc bison build-essential ccache curl flex g++-multilib \
            gcc-multilib git gnupg gperf libxml2-utils lzop \
            pngcrush schedtool squashfs-tools xsltproc zip zlib1g-dev \
            libncurses-dev libssl-dev libelf-dev python3 python3-pip \
            cpio device-tree-compiler
          sudo pip3 install pyelftools

      - name: Setup Toolchain
        run: |
          # Baixa o Clang estável
          wget -O clang.tar.gz https://github.com/llvm/llvm-project/releases/download/llvmorg-17.0.6/clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          tar -xf clang.tar.gz
          mv clang+llvm-17.0.6-x86_64-linux-gnu-ubuntu-22.04 clang
          
          # Baixa o GCC para ARM64
          wget -O gcc.tar.xz https://developer.arm.com/-/media/Files/downloads/gnu/13.2.rel1/binrel/arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu.tar.xz
          tar -xf gcc.tar.xz
          mv arm-gnu-toolchain-13.2.rel1-x86_64-aarch64-none-linux-gnu gcc
          
          export PATH=$PWD/clang/bin:$PWD/gcc/bin:$PATH
          echo "PATH=$PWD/clang/bin:$PWD/gcc/bin:$PATH" >> $GITHUB_ENV

      - name: Clone Kernel Source (GKI - Generic)
        run: |
          # Usa o kernel GKI padrão da comunidade para garnet
          git clone --depth=1 -b android14-6.1 https://github.com/LineageOS/android_kernel_xiaomi_sm6375.git kernel || \
          git clone --depth=1 -b lineage-21 https://github.com/LineageOS/android_kernel_xiaomi_sm6375.git kernel || \
          git clone --depth=1 https://github.com/LineageOS/android_kernel_xiaomi_sm6375.git kernel
          
          cd kernel
          echo "Kernel cloned successfully!"

      - name: Apply SukiSU Ultra
        run: |
          cd kernel
          # Aplica o SukiSU Ultra
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s main
          
          # Habilita KPM se quiser
          echo "CONFIG_KPM=y" >> arch/arm64/configs/vendor/garnet_defconfig || \
          echo "CONFIG_KPM=y" >> arch/arm64/configs/garnet_defconfig || \
          echo "CONFIG_KPM=y" >> arch/arm64/configs/gki_defconfig

      - name: Configure and Build
        run: |
          cd kernel
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CC=clang
          export LD=ld.lld
          export CLANG_TRIPLE=aarch64-linux-gnu-
          
          # Encontra a defconfig
          DEFCONFIG=$(find arch/arm64/configs -name "*garnet*" -o -name "*gki*" | head -1)
          if [ -z "$DEFCONFIG" ]; then
            DEFCONFIG="gki_defconfig"
          fi
          DEFCONFIG=$(basename "$DEFCONFIG")
          echo "Using defconfig: $DEFCONFIG"
          
          # Gera o .config
          make $DEFCONFIG
          
          # Compila
          make -j$(nproc)

      - name: Prepare AnyKernel3
        run: |
          # Verifica se o kernel foi compilado
          if [ -f "kernel/arch/arm64/boot/Image" ]; then
            echo "Kernel built successfully!"
            cp kernel/arch/arm64/boot/Image kernel/arch/arm64/boot/Image.gz-dtb
          elif [ -f "kernel/arch/arm64/boot/Image.gz-dtb" ]; then
            echo "Kernel built successfully!"
          else
            echo "Build failed!"
            exit 1
          fi
          
          # Clona AnyKernel3
          git clone https://github.com/osm0sis/AnyKernel3.git anykernel
          
          # Copia o kernel
          cp kernel/arch/arm64/boot/Image.gz-dtb anykernel/
          
          # Cria o anykernel.sh
          cat > anykernel/anykernel.sh << 'EOF'
          #!/sbin/sh
          #
          properties() {
            kernel.string=SukiSU Ultra Kernel ${{ github.event.inputs.kernel_version }}
            do.devicecheck=1
            do.modules=0
            do.cleanup=1
            do.cleanuponabort=0
            device.name1=${{ github.event.inputs.device_codename }}
            device.name2=garnet
            supported.versions=16
          }
          block=/dev/block/bootdevice/by-name/boot
          is_slot_device=1
          ramdisk_compression=auto
          
          . tools/ak3-core.sh
          split_boot
          flash_boot
          done
          EOF
          
          # Cria ZIP
          cd anykernel
          zip -r ../SukiSU_Kernel_${{ github.event.inputs.kernel_version }}_${{ github.event.inputs.device_codename }}.zip *

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU-Kernel-${{ github.event.inputs.kernel_version }}
          path: SukiSU_Kernel_*.zip
          retention-days: 30

      - name: Create Release
        if: github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ github.run_number }}
          name: "SukiSU Kernel ${{ github.event.inputs.kernel_version }} - Build ${{ github.run_number }}"
          files: SukiSU_Kernel_*.zip
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
