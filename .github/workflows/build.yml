name: Compilar Kernel SukiSU Garnet crDroid

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aumentar Espaço em Disco
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libncurses5-dev bison flex libelf-dev bc zip unzip curl git python3 libssl-dev wget

      - name: Baixar Código Fonte do Kernel (crDroid Source)
        run: |
          git clone --depth=1 https://github.com/crdroidandroid/android_xiaomi_kernel_garnet.git -b 16.0 kernel

      - name: Baixar Toolchain (ZyC Clang 18)
        run: |
          mkdir clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/18.0.0-20240322-release/Clang-18.0.0-20240322.tar.gz
          tar -xf Clang-18.0.0-20240322.tar.gz -C clang
          rm Clang-18.0.0-20240322.tar.gz

      - name: Integrar SukiSU Ultra
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash -

      - name: Ativar flags SukiSU no defconfig
        run: |
          cd kernel
          echo "CONFIG_KSU=y" >> arch/arm64/configs/garnet_defconfig
          echo "CONFIG_KPM=y" >> arch/arm64/configs/garnet_defconfig
          echo "CONFIG_KALLSYMS=y" >> arch/arm64/configs/garnet_defconfig
          echo "CONFIG_KALLSYMS_ALL=y" >> arch/arm64/configs/garnet_defconfig

      - name: Compilar Kernel
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          make mrproper
          make garnet_defconfig
          make -j$(nproc --all) O=out

      - name: Empacotar no AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          cp kernel/out/arch/arm64/boot/Image AnyKernel3/
          cd AnyKernel3
          zip -r9 SukiSU_Kernel_Garnet_crDroid.zip *

      - name: Enviar Arquivo Final (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_Kernel_Garnet_crDroid
          path: AnyKernel3/SukiSU_Kernel_Garnet_crDroid.zip
