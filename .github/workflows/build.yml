name: Compilar Kernel SukiSU Garnet crDroid

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Aumentar Espaço em Disco
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 8192
          temp-reserve-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'

      - name: Instalar Dependências
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev libncurses5-dev bison flex libelf-dev bc zip unzip curl git python3 wget

      - name: Baixar Código Fonte do Kernel (crDroid Source)
        run: |
          git clone --depth=1 https://github.com/crdroidandroid/android_xiaomi_kernel_garnet.git -b 16.0 kernel

      - name: Baixar Toolchain (ZyC Clang 16)
        run: |
          mkdir -p clang
          wget -q https://github.com/ZyCromerZ/Clang/releases/download/16.0.6-20260807-release/Clang-16.0.6-20260807.tar.gz -O clang.tar.gz
          tar -xf clang.tar.gz -C clang
          rm clang.tar.gz

      - name: Integrar SukiSU Ultra
        run: |
          cd kernel
          curl -LSs "https://raw.githubusercontent.com/sukisu-ultra/sukisu-ultra/main/kernel/setup.sh" | bash -

      - name: Compilar Kernel
        run: |
          cd kernel
          export PATH="$(pwd)/../clang/bin:${PATH}"
          export ARCH=arm64
          export SUBARCH=arm64
          export CC=clang
          export CROSS_COMPILE=aarch64-linux-gnu-
          export LLVM=1
          export LLVM_IAS=1

          # 1. Limpa completamente a arvore de codigo
          make mrproper

          # 2. Localiza e aplica o defconfig correto do Garnet
          if [ -f arch/arm64/configs/garnet_defconfig ]; then
              DEFCONFIG="garnet_defconfig"
          elif [ -f arch/arm64/configs/vendor/garnet_defconfig ]; then
              DEFCONFIG="vendor/garnet_defconfig"
          elif [ -f arch/arm64/configs/vendor/garnet-perf_defconfig ]; then
              DEFCONFIG="vendor/garnet-perf_defconfig"
          else
              DEFCONFIG="gki_defconfig"
          fi

          echo "Usando o defconfig: $DEFCONFIG"
          make $DEFCONFIG

          # 3. Injeta as configs obrigatorias do SukiSU diretamente no .config gerado
          echo "CONFIG_KSU=y" >> .config
          echo "CONFIG_KPM=y" >> .config
          echo "CONFIG_KALLSYMS=y" >> .config
          echo "CONFIG_KALLSYMS_ALL=y" >> .config

          # 4. Inicia a compilacao na propria pasta
          make -j$(nproc --all)

      - name: Empacotar no AnyKernel3
        run: |
          git clone https://github.com/osm0sis/AnyKernel3.git AnyKernel3
          if [ -f kernel/arch/arm64/boot/Image ]; then
              cp kernel/arch/arm64/boot/Image AnyKernel3/
          elif [ -f kernel/arch/arm64/boot/Image.gz ]; then
              cp kernel/arch/arm64/boot/Image.gz AnyKernel3/
          fi
          cd AnyKernel3
          zip -r9 SukiSU_Kernel_Garnet_crDroid.zip *

      - name: Enviar Arquivo Final (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: SukiSU_Kernel_Garnet_crDroid
          path: AnyKernel3/SukiSU_Kernel_Garnet_crDroid.zip
